# 生产环境覆盖：HTTPS、域名、备份、监控
# 用法：docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

version: "3.9"

services:
  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro

  backend:
    restart: always
    environment:
      APP_ENV: prod

  frontend:
    restart: always
