## 80 端口:certbot challenge + 自动跳 https
server {
    listen 80;
    server_name kb.example.com www.kb.example.com;

    # Let's Encrypt webroot challenge (certbot renew 必经)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # 其他全部 301 到 https
    location / {
        return 301 https://$host$request_uri;
    }
}

## 443 端口:HTTPS 反代到 backend / frontend
server {
    listen 443 ssl;
    http2 on;
    server_name kb.example.com www.kb.example.com;

    ssl_certificate     /etc/letsencrypt/live/kb.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kb.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 32M;

    # 前端入口 index.html:不缓存(部署后浏览器立即拿到新资源引用)
    location = /index.html {
        proxy_pass http://frontend:80/index.html;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # 带内容 hash 的静态资源:内容永不变,浏览器长缓存
    location /assets/ {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 前端静态资源
    location / {
        proxy_pass http://frontend:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API(SSE 友好)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # 公告图片等用户上传
    location /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # /health
    location = /health {
        proxy_pass http://backend:8000/health;
    }
}

## 容错:用 IP 直接访问的请求(无 Host 头或 Host 是 IP) -> 200 + 简单提示
## 这避免某些扫描器或外站直接打 IP 时拿到我们的应用页面
server {
    listen 80 default_server;
    server_name _;
    return 444;  # nginx 私有码:不返回任何内容直接关连接
}
