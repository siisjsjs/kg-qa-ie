name: kgqa

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: kg_qa_ie
      MYSQL_USER: kgqa
      MYSQL_PASSWORD: CHANGE_ME
      MYSQL_ROOT_PASSWORD: CHANGE_ME
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pCHANGE_ME"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  neo4j:
    image: neo4j:5.24
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/CHANGE_ME
      NEO4J_PLUGINS: '["apoc","graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      NEO4J_server_memory_heap_initial__size: "256m"
      NEO4J_server_memory_heap_max__size: "768m"
      NEO4J_server_memory_pagecache_size: "256m"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  chroma:
    image: chromadb/chroma:0.5.15
    restart: unless-stopped
    volumes:
      - chroma_data:/chroma/chroma

  backend:
    image: kgqa-backend:latest
    restart: unless-stopped
    environment:
      APP_ENV: prod
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      APP_SECRET_KEY: CHANGE_ME
      DATABASE_URL: mysql+pymysql://kgqa:CHANGE_ME@mysql:3306/kg_qa_ie?charset=utf8mb4
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: CHANGE_ME
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
      WIKI_ROOT: /app/data/wiki
      CACHE_DIR: /app/data/cache
      CHROMA_PERSIST_DIR: /app/data/chroma
      LLM_PROVIDER: deepseek
      LLM_BASE_URL: https://api.deepseek.com
      LLM_MODEL: deepseek-chat
      LLM_TEMPERATURE: "0.3"
      LLM_MAX_TOKENS: "8192"
      EMBEDDING_PROVIDER: openai_compat
      EMBEDDING_MODEL: BAAI/bge-m3
      EMBEDDING_DIM: "1024"
      JWT_SECRET: CHANGE_ME
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TTL_MIN: "60"
      JWT_REFRESH_TTL_DAYS: "14"
      CORS_ORIGINS: "http://localhost,http://127.0.0.1,https://kb.example.com"
    depends_on:
      mysql:
        condition: service_healthy
      neo4j:
        condition: service_started
      chroma:
        condition: service_started
    volumes:
      # 整个 data 目录持久化:wiki / cache(含 fernet key + system_config) / uploads / chroma
      - ./data:/app/data

  frontend:
    image: kgqa-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend

volumes:
  mysql_data:
  neo4j_data:
  neo4j_logs:
  chroma_data:
