[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kg-qa-ie-backend"
version = "0.1.0"
description = "Industrial Engineering Knowledge Base & Graph QA — backend (FastAPI)"
readme = "../README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # ===== Web 框架 =====
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1.3",

    # ===== 数据校验 / 配置 =====
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.5.0",

    # ===== ORM / 关系库 =====
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.3",
    "pymysql>=1.1.1",
    "cryptography>=43.0.1",

    # ===== 图库 / 向量库 =====
    "neo4j>=5.24.0",
    "chromadb==0.5.15",

    # ===== Markdown / Wiki =====
    "python-frontmatter>=1.1.0",
    "mistune>=3.0.2",
    "pyyaml>=6.0.2",

    # ===== 安全 =====
    "pyjwt[crypto]>=2.9.0",
    "passlib[bcrypt]>=1.7.4",
    "argon2-cffi>=23.1.0",

    # ===== HTTP / 异步 =====
    "httpx>=0.27.2",
    "aiofiles>=24.1.0",
    "tenacity>=9.0.0",

    # ===== 日志 =====
    "loguru>=0.7.2",

    # ===== 图算法（社区发现等）=====
    "networkx>=3.3",
    "python-louvain>=0.16",

    # ===== 工具 =====
    "orjson>=3.10.7",
    "python-slugify>=8.0.4",
    "json-repair>=0.60.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.2",
    "ruff>=0.6.9",
    "mypy>=1.11.2",
]
# Provider 可选依赖（按需安装），骨架阶段不强制
llm = [
    "anthropic>=0.36.0",
    "openai>=1.51.0",
    "ollama>=0.3.3",
]
embedding = [
    "sentence-transformers>=3.1.1",
    "FlagEmbedding>=1.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
